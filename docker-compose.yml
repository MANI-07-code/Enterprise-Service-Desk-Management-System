version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db

    environment:
        MYSQL_ROOT_PASSWORD: mani@2005
        MYSQL_DATABASE: helpdesk_db

    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .

    container_name: helpdesk-app

    ports:
      - "8080:8080"

    depends_on:
      - mysql

volumes:
    mysql_data:


